name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-contracts:
    name: macOS Go ${{ matrix.go-version }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Verify contracts and Phase 1/2 core
        run: bash scripts/check.sh

      - name: Verify Phase 4 Host Profiles and guidance
        run: bash scripts/verify_host_profiles.sh

      - name: Verify release contracts
        if: matrix.go-version == '1.27.x'
        run: |
          bash scripts/verify_release_metadata.sh
          bash scripts/verify_release_workflow.sh

      - name: Run macOS Phase 1 acceptance
        if: matrix.go-version == '1.27.x'
        run: bash scripts/run_phase1_acceptance.sh

      - name: Run macOS Phase 3 Witness acceptance
        if: matrix.go-version == '1.27.x'
        run: bash scripts/run_phase3_acceptance.sh

  linux-runtime:
    name: Linux runtime and container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum

      - name: Verify Linux runtime and MCP core
        run: bash scripts/check.sh

      - name: Verify Phase 4 Host Profiles and guidance
        run: bash scripts/verify_host_profiles.sh

      - name: Verify reproducible release contracts
        run: |
          bash scripts/verify_release_metadata.sh
          bash scripts/verify_release_workflow.sh
          bash scripts/test_release_assets.sh
          bash scripts/test_install_lifecycle.sh

      - name: Run Linux container CLI and MCP acceptance
        run: bash scripts/run_linux_acceptance.sh

      - name: Run Linux Phase 3 Witness acceptance
        run: bash scripts/run_phase3_acceptance.sh

  windows-runtime:
    name: Windows runtime and candidate acceptance
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum

      - name: Verify Windows runtime and MCP core
        shell: pwsh
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Verify Phase 4 Host Profiles and guidance
        shell: bash
        run: bash scripts/verify_host_profiles.sh

      - name: Run Windows installed CLI and MCP acceptance
        shell: pwsh
        run: ./scripts/run_windows_phase1_acceptance.ps1 -CandidateCommit '${{ github.sha }}'

      - name: Run Windows Phase 3 Witness acceptance
        shell: pwsh
        run: ./scripts/run_windows_phase3_acceptance.ps1 -CandidateCommit '${{ github.sha }}'
