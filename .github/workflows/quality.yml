name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-contracts:
    name: macOS Go ${{ matrix.go-version }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Verify contracts and Phase 1/2 core
        run: bash scripts/check.sh

      - name: Run macOS Phase 1 acceptance
        if: matrix.go-version == '1.27.x'
        run: bash scripts/run_phase1_acceptance.sh

  linux-runtime:
    name: Linux runtime and container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum

      - name: Verify Linux runtime and MCP core
        run: bash scripts/check.sh

      - name: Run Linux container CLI and MCP acceptance
        run: bash scripts/run_linux_acceptance.sh

  windows-runtime:
    name: Windows runtime and candidate acceptance
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum

      - name: Verify Windows runtime and MCP core
        shell: pwsh
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Run Windows installed CLI and MCP acceptance
        shell: pwsh
        run: ./scripts/run_windows_phase1_acceptance.ps1 -CandidateCommit '${{ github.sha }}'
