name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and attest
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum

      - name: Verify tag and default-branch identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install pinned CycloneDX generator
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run release gates
        shell: bash
        run: |
          bash scripts/check.sh
          bash scripts/verify_release_metadata.sh
          bash scripts/verify_host_profiles.sh
          bash scripts/verify_release_workflow.sh
          bash scripts/test_install_lifecycle.sh
          bash scripts/test_release_assets.sh

      - name: Build and verify release assets
        shell: bash
        run: |
          bash scripts/build_release_assets.sh "$RUNNER_TEMP/release-dist"
          bash scripts/verify_release_assets.sh "$RUNNER_TEMP/release-dist" "$(cat VERSION)" "$(git rev-parse HEAD)"
          mv "$RUNNER_TEMP/release-dist" dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Preserve release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-runtime-proof-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: MCPB native smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download exact release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: agent-runtime-proof-${{ github.ref_name }}
          path: release-dist
      - name: Run the packaged native binary and MCP lifecycle
        shell: bash
        run: |
          "${{ matrix.python }}" scripts/smoke_mcpb.py \
            --mcpb "release-dist/agent-runtime-proof_$(cat VERSION).mcpb" \
            --version "$(cat VERSION)" \
            --commit "$(git rev-parse HEAD)"

  publish:
    name: Publish verified release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: agent-runtime-proof-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Agent Runtime Proof $(cat VERSION)" --generate-notes
